name: PhishGuard Automatic Retraining

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * 0"

  push:
    paths:
      - "data/raw/phishing_dataset.csv"

jobs:
  retrain:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mlflow

      - name: Preprocess dataset
        run: |
          python src/preprocessing.py

      - name: Train multiple models
        run: |
          python src/train.py

      - name: Select best model
        run: |
          python src/select_best_model.py

      - name: Upload retrained model
        uses: actions/upload-artifact@v4
        with:
          name: phishguard-best-model
          path: models/best_model.pkl

      - name: Upload training outputs
        uses: actions/upload-artifact@v4
        with:
          name: phishguard-training-results
          path: |
            mlflow.db
            data/processed/